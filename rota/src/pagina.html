<title>Rota de Estudos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: sidebar + main on dotted notebook paper; pastel highlighter colors, ink-blue text. Bottom tabs on phone. */
:root{
  --bg:#FAF8F3; --grid:#E4DFD3; --surface:#FFFEFB; --surface-2:#F4F1EA; --line:#E6E0D3;
  --ink:#24304A; --muted:#66708A; --faint:#A3A8B8;
  --accent:#3E7C5C; --accent-ink:#FFFFFF; --accent-soft:#E2F1E6; --accent-2:#9CCFB0;
  --btn-bg:#BFE3CB; --btn-ink:#1F3D2C; --margin:#F2B8B5;
  --note:#FBE7A1; --note-ink:#4A3B0E;
  --ok:#3E8A5F; --ok-soft:#E1F2E6; --warn:#B36A1E; --warn-soft:#FCEBD7; --bad:#C2484F; --bad-soft:#FBE3E2;
  --s-devops:#A98FE3; --s-gp:#7CC79B; --s-co:#F2A488; --s-t1:#E9C85B; --s-t2:#86B9E4; --s-t3:#A9B1C2;
  --shadow:0 1px 0 rgba(36,48,74,.04),0 4px 14px rgba(36,48,74,.05);
  --f-display:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191B21; --grid:#2A2D36; --surface:#20232B; --surface-2:#272A33; --line:#323643;
  --ink:#E9ECF4; --muted:#A3AABD; --faint:#6E7488;
  --accent:#9CD3B2; --accent-ink:#13261B; --accent-soft:#25352C; --accent-2:#6FAF8B;
  --btn-bg:#9CD3B2; --btn-ink:#13261B; --margin:#7A4A4A;
  --note:#E8CF73; --note-ink:#2E250A;
  --ok:#7FD3A0; --ok-soft:#1F3328; --warn:#F2B36B; --warn-soft:#3A2D1C; --bad:#F28B8F; --bad-soft:#3A2224;
  --s-devops:#BCA6F2; --s-gp:#93D9AF; --s-co:#F6B49B; --s-t1:#EFD37A; --s-t2:#9CC9EE; --s-t3:#B5BCCB;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191B21; --grid:#2A2D36; --surface:#20232B; --surface-2:#272A33; --line:#323643;
  --ink:#E9ECF4; --muted:#A3AABD; --faint:#6E7488;
  --accent:#9CD3B2; --accent-ink:#13261B; --accent-soft:#25352C; --accent-2:#6FAF8B;
  --btn-bg:#9CD3B2; --btn-ink:#13261B; --margin:#7A4A4A;
  --note:#E8CF73; --note-ink:#2E250A;
  --ok:#7FD3A0; --ok-soft:#1F3328; --warn:#F2B36B; --warn-soft:#3A2D1C; --bad:#F28B8F; --bad-soft:#3A2224;
  --s-devops:#BCA6F2; --s-gp:#93D9AF; --s-co:#F6B49B; --s-t1:#EFD37A; --s-t2:#9CC9EE; --s-t3:#B5BCCB;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background-color:var(--bg);background-image:radial-gradient(var(--grid) 1px,transparent 1.2px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%;max-width:1360px;margin:0 auto}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));padding:22px 14px 18px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);background:var(--surface);box-shadow:inset -6px 0 0 -4px var(--margin)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--btn-bg);display:grid;place-items:center;color:var(--btn-ink)}
.brand b{font-family:var(--f-hand);font-size:28px;font-weight:700;line-height:.9}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:-2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;padding:12px;border-radius:12px;background:var(--surface-2);font-size:12px;color:var(--muted)}
.side-foot strong{color:var(--ink);display:block;font-size:13px}

main{min-width:0;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:1025px){main{padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top .hello{font-family:var(--f-hand);font-size:21px;color:var(--muted);line-height:1.1}
.top h1{font-size:26px;font-weight:800;margin-top:2px}
.top .sub{color:var(--muted);margin-top:4px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{text-decoration:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-h h2 svg{width:17px;height:17px;color:var(--accent)}
.card-h a,.card-h .link{color:var(--accent);font-size:12px;font-weight:600;text-decoration:none;background:none;border:0;padding:0}

.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.dash{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.dash3{grid-template-columns:minmax(0,1fr) 200px minmax(0,1.2fr)}
@media (max-width:1100px){.dash3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.dash3 .chart-card{grid-column:1/-1}}
@media (max-width:1180px){.dash,.dash3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.stat{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:500}
.stat .val{white-space:nowrap;font-family:var(--f-display);font-size:28px;font-weight:800;margin-top:6px;line-height:1}
.stat .val small{font-size:14px;color:var(--muted);font-weight:600}
.stat .foot{font-size:12px;color:var(--muted);margin-top:6px}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.ico svg{width:20px;height:20px}
.ico.v{background:color-mix(in srgb,var(--s-devops) 28%,transparent);color:var(--ink)} .ico.o{background:var(--warn-soft);color:var(--warn)} .ico.g{background:var(--ok-soft);color:var(--ok)} .ico.r{background:var(--bad-soft);color:var(--bad)}

/* session rows */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:72px 12px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .time{font-size:12px;color:var(--muted);line-height:1.3}
.row .time b{display:block;color:var(--ink);font-weight:600;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--accent)) 18%,transparent)}
.row .what{min-width:0;cursor:pointer}
.row .what .t{font-weight:600;overflow-wrap:anywhere}
.row .what .m{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.row.done .what .t{text-decoration:line-through;color:var(--muted)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:transparent;padding:0}
.check:hover{border-color:var(--accent)}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:15px;height:15px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.aula{background:color-mix(in srgb,var(--s-devops) 30%,transparent);color:var(--ink)}
.pill.trabalho{background:var(--warn-soft);color:var(--warn)}
.pill.entrega{background:var(--bad-soft);color:var(--bad)}
.pill.estudo{background:color-mix(in srgb,var(--s-t2) 32%,transparent);color:var(--ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.late{background:var(--bad-soft);color:var(--bad)}
.pill.soon{background:var(--warn-soft);color:var(--warn)}
.empty{padding:22px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* ring */
.ringwrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-family:var(--f-display);font-size:30px;font-weight:800;display:block;line-height:1}
.ring .c span{font-size:11px;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:10px;flex:1;min-width:150px}
.legend div{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--c)}

/* subject bars */
.bars{display:flex;flex-direction:column;gap:14px}
.bar-h{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:6px}
.bar-h span{color:var(--muted);font-size:12px}
.track{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;position:relative}
.track i{display:block;height:100%;border-radius:inherit;background:var(--c)}
.track em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35;border-radius:2px}

.streak{background:var(--note);color:var(--note-ink);border:0;border-radius:4px 4px 18px 4px;transform:rotate(-1.2deg);box-shadow:0 10px 18px -8px rgba(60,45,10,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.streak .flame{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.35);display:grid;place-items:center}
.streak .flame svg{width:28px;height:28px}
.streak b{font-family:var(--f-display);font-size:40px;font-weight:800;line-height:1}
.streak small{font-size:12px;opacity:.85}
.streak .h{font-family:var(--f-hand);font-weight:700;font-size:22px;line-height:1}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}

.alert{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;border-radius:var(--r);background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 25%,transparent);margin-bottom:16px}
.alert.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.alert .txt{min-width:0}
.alert b{display:block}
.alert span{font-size:13px;color:var(--muted)}

/* agenda */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.week{display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr)) auto;gap:6px;align-items:center;margin-bottom:16px}
.wd{border:1px solid transparent;background:transparent;border-radius:14px;padding:8px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.wd small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.wd b{font-family:var(--f-display);font-size:17px}
.wd .dots{display:flex;gap:2px;height:5px}
.wd .dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.wd.today b{color:var(--accent)}
.wd[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-ink)}
.wd[aria-pressed="true"] small,.wd[aria-pressed="true"] b{color:var(--btn-ink)}
.nav-arrow{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.nav-arrow svg{width:16px;height:16px}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.month .hd{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.06em}
.md{min-height:62px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.md.out{opacity:.4}
.md.today{border-color:var(--accent)}
.md[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-2)}
.md b{font-size:12px;font-weight:600}
.md .dots{display:flex;flex-wrap:wrap;gap:3px}
.md .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.md .dots i.e{width:auto;height:auto;font-style:normal;font-size:9px;font-weight:700;color:var(--bad);background:none}

/* subjects */
.subj-grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
@media (max-width:420px){.subj-grid{grid-template-columns:minmax(0,1fr)}}
.subj-h{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.subj-h .sw{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--c) 38%,transparent);color:var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px;flex:none}
.subj-h h3{font-size:15px}
.subj-h p{margin:0;font-size:12px;color:var(--muted)}
.subj-h .pct{margin-left:auto;font-family:var(--f-display);font-weight:800;font-size:20px}
.parts{display:grid;grid-template-columns:44px repeat(5,minmax(0,1fr));gap:5px;align-items:center;margin-top:14px}
.parts .ln{font-size:11px;color:var(--muted);font-weight:600}
.parts .ph{font-size:10px;color:var(--faint);text-align:center}
.cell{height:24px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);padding:0}
.cell:hover{border-color:var(--c)}
.cell.on{background:var(--c);border-color:var(--c)}
.cell.due{border-color:var(--bad);border-style:dashed}
.subj-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted)}

/* deadlines */
.dl{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 4px;border-top:1px solid var(--line)}
.dl:first-child{border-top:0}
.cal-chip{border-radius:12px;background:var(--surface-2);text-align:center;padding:6px 0;border:1px solid var(--line)}
.cal-chip small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.cal-chip b{font-family:var(--f-display);font-size:20px}
.dl .t{font-weight:600}
.dl .m{font-size:12px;color:var(--muted)}

/* forms & modal */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:70px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:inline-flex}
.days input{position:absolute;opacity:0;pointer-events:none}
.days span{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2)}
.days input:checked+span{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.days input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.scrim{position:fixed;inset:0;background:rgba(14,12,30,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:20px;width:min(560px,100%);max-height:100%;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal h2{font-size:18px;margin-bottom:16px}
.modal .acts{display:flex;gap:8px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.modal .acts div{display:flex;gap:8px}
.mini-list{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin:12px 0}
.mini-list .r{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.mini-list .r:first-child{border-top:0}
.mini-list .r span{color:var(--muted);white-space:nowrap}

/* trilhas */
.mods{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.mod{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:13px;border-top:1px dashed var(--line)}
.mod:first-child{border-top:0}
.mod.on span{color:var(--muted);text-decoration:line-through}
.mod .check{width:22px;height:22px;border-radius:6px}

/* iphone */
.steps{counter-reset:s;display:flex;flex-direction:column;gap:12px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:9px;background:var(--btn-bg);color:var(--btn-ink);font-weight:700;display:grid;place-items:center;font-size:13px}
.steps li p{margin:3px 0 0}
.steps ol{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px;color:var(--muted)}
.steps ol b,.steps p b{color:var(--ink)}
code,.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
textarea.payload{width:100%;min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:10px}
.note{font-size:12px;color:var(--muted)}

/* bottom tabs on phones */
.tabs{display:none}
@media (max-width:1024px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
