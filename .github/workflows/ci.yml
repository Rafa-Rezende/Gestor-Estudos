name: CI
on:
  push: 
    branches: [main]
  pull_request:

jobs:
    testes:
     runs-on: ubuntu-latest
     steps:
     - uses: actions/checkout@v4

     - uses: actions/setup-python@v5
       with:
         python-version: "3.13"

     - name: instalar dependências
       run: pip install -r requirements-dev.txt

     - name: Lint
       run: ruff check .
     
     - name: Testes
       run: python -m pytest -v
